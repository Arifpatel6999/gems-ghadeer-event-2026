<!doctype html>
<html lang="ur">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>احادیث — اردو · TSR GEMS Ghadeer Challenge</title>
  <link rel="icon" href="assets/images/logo.jpg" type="image/jpeg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/hadees-book.css" />
  <style>
    @font-face {
      font-family: 'AlviNastaleeq';
      src: url('assets/fonts/AlviNastaleeq.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
    .page-header h1,
    .page-header p {
      font-family: 'AlviNastaleeq', 'Amiri', serif;
      direction: rtl;
    }
    .page-tag {
      font-family: 'AlviNastaleeq', 'Amiri', serif;
      font-size: 0.7rem;
      direction: rtl;
      text-align: right;
      letter-spacing: normal;
      text-transform: none;
      margin-bottom: 6px;
      color: rgba(155, 100, 60, 0.75);
    }
    @media (min-width: 640px) {
      .page-tag { font-size: 0.82rem; }
    }
    .translation {
      font-family: 'AlviNastaleeq', 'Amiri', serif;
      line-height: 2.0;
      direction: rtl;
      text-align: right;
      letter-spacing: normal;
    }
    .reference {
      font-family: 'AlviNastaleeq', 'Amiri', serif;
      font-size: 0.65rem;
      direction: rtl;
      text-align: right;
      letter-spacing: normal;
    }
    @media (min-width: 640px) {
      .reference { font-size: 0.72rem; }
    }
  </style>
</head>

<body>

  <nav class="site-header">
    <div class="site-header-inner">
      <a class="site-logo" href="/">
        <img src="assets/images/logo.jpg" alt="TSR GEMS logo" />
        <span class="site-logo-name">TSR GEMS</span>
      </a>
      <div class="site-nav">
        <a href="event-ghadeer.html">Event</a>
        <a href="https://www.instagram.com/thestrongrope_gems/" target="_blank" rel="noopener">Instagram</a>
        <a href="https://wa.me/918070151412" target="_blank" rel="noopener" class="nav-cta">Submit Video</a>
      </div>
    </div>
  </nav>

  <div class="page-header">
    <div class="container">
      <div class="lang-badge">🌐 اردو</div>
      <h1>احادیث — عید غدیر چیلنج</h1>
      <p>نیچے دی گئی احادیث میں سے کوئی ایک حدیث یاد کریں اور اپنی ویڈیو میں پڑھیں۔</p>
    </div>
  </div>

  <main>
    <section class="book-section">
      <div class="container">

        <div class="book-outer">
          <div class="book" id="book">

            <!-- LEFT PAGE: Arabic -->
            <div class="page-left" id="pageLeft">
              <div class="page-inner">
                <div class="book-logo">
                  <img src="assets/images/logo.jpg" alt="TSR GEMS" />
                  <span class="book-logo-name">TSR GEMS</span>
                </div>
                <div class="hadees-badge" id="hadeesBadge">1</div>
                <div class="arabic-intro">قَالَ رَسُوْلُ اللّٰهِ (ص):</div>
                <div class="arabic-wrap">
                  <div class="arabic" id="arabicText"></div>
                </div>
                <div class="page-foot" id="pageNumLeft">1 / 5</div>
              </div>
            </div>

            <!-- SPINE -->
            <div class="book-spine"></div>

            <!-- RIGHT PAGE: Translation -->
            <div class="page-right" id="pageRight">
              <div class="page-inner">
                <div class="page-tag">✦ ترجمہ</div>
                <div class="translation-wrap">
                  <p class="translation" id="translationText"></p>
                </div>
                <div class="page-divider"></div>
                <div class="reference" id="referenceText"></div>
                <div class="page-foot" id="pageNumRight">1 / 5</div>
              </div>
            </div>

            <!-- FLIP LEAF -->
            <div class="flip-leaf" id="flipLeaf">
              <div class="flip-face flip-front" id="flipFront"></div>
              <div class="flip-face flip-back" id="flipBack"></div>
            </div>

          </div>
        </div>

        <!-- Audio -->
        <div class="audio-bar">
          <span class="audio-bar-label">🎧</span>
          <button class="audio-play-btn" id="audioPlayBtn" aria-label="Play">▶</button>
          <div class="audio-track">
            <div class="audio-progress-wrap" id="audioProgressWrap">
              <div class="audio-progress-fill" id="audioProgressFill"></div>
            </div>
            <span class="audio-time" id="audioTime">0:00</span>
          </div>
        </div>

        <!-- Navigation -->
        <div class="book-nav">
          <button class="nav-btn" id="prevBtn" disabled>&#8592; Prev</button>
          <div class="book-dots" id="bookDots"></div>
          <button class="nav-btn" id="nextBtn">Next &#8594;</button>
        </div>

        <p class="swipe-hint">← صفحہ پلٹیں →</p>

      </div>
    </section>
  </main>

  <footer>
    <div>© <span id="y"></span> TSR GEMS · <a href="event-ghadeer.html">← Back to Event Page</a></div>
    <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
  </footer>

  <script>
    const ahadees = [
      {
        arabic: "مَنْ آذَیْ عَلِیّاً فَقَدْ آذَانِیْ",
        translation: `رسول اللہ <strong>(صلی اللہ علیہ وآلہ)</strong> نے فرمایا:<br />«جس نے علی (ع) کو اذیت پہنچائی، اُس نے یقیناً مجھے اذیت پہنچائی۔»`,
        reference: "بحار الأنوار، ج ۲۸، ص ۴۱۰",
        audio: "assets/audio/1st%20Jis%20ne%20Ali%20a%20s%20ko%20azeeyat%20pohnchai-esv2-100p-bg-m-music-m.mp3"
      },
      {
        arabic: "یَا عَلِیُّ حَاسِدُكَ حَاسِدِیْ وَ حَاسِدِیْ حَاسِدُ اللّٰهِ وَ حَاسِدُ اللّٰهِ فِی النَّارِ",
        translation: `رسول اللہ <strong>(صلی اللہ علیہ وآلہ)</strong> نے فرمایا:<br />«اے علیؑ! آپ سے حسد كرنے والا، مجھ سے حسد كرنے والا ہے اور مجھ سے حسد كرنے والا، اللہ سے حسد كرنے والا ہے اور اللہ سے حسد كرنے والے كا ٹھكانا جہنم ہے۔»`,
        reference: "امالیِ شیخ طوسیؒ، ص ۶۲۴، مجلس ۳۰، حدیث ۱",
        audio: "assets/audio/2nd%20Ali%20a%20s%20se%20hasad%20karne%20waala-esv2-100p-bg-m-music-m.mp3"
      },
      {
        arabic: "یَا عَلِیُّ سَعِدَ مَنْ تَوَلَّاكَ وَ شَقِیَ مَنْ عَادَاكَ",
        translation: `رسول اللہ <strong>(صلی اللہ علیہ وآلہ)</strong> نے فرمایا:<br />«اے علیؑ! وہ شخص جنتی ہے جس نے آپ كی ولایت قبول كی، اور وہ جہنمی ہے جس نے آپ سے دشمنی ركھی۔»`,
        reference: "امالیِ شیخ صدوقؒ، ص ۲۳، مجلس ۴، حدیث ۸",
        audio: "assets/audio/3rd%20JIs%20ne%20Ali%20a%20s%20ki%20wilayat%20qubool%20ki-esv2-100p-bg-m-music-m.mp3"
      },
      {
        arabic: "یَا عَلِیُّ شِیعَتُكَ شِیعَةُ اللّٰهِ وَ أَنْصَارُكَ أَنْصَارُ اللّٰهِ",
        translation: `رسول اللہ <strong>(صلی اللہ علیہ وآلہ)</strong> نے فرمایا:<br />«اے علیؑ! آپ کے شیعہ اللہ کے شیعہ ہیں، اور آپ کے مددگار اللہ کے مددگار ہیں۔»`,
        reference: "امالیِ شیخ صدوقؒ، ص ۲۳، مجلس ۴، حدیث ۸",
        audio: "assets/audio/4th%20Ali%20a.s.%20ke%20shiah-esv2-100p-bg-m-music-m.mp3"
      },
      {
        arabic: "یَا عَلِیُّ فَإِنَّ اللّٰهَ قَدْ بَاهَی بِكَ مَلَائِكَتَهُ",
        translation: `رسول اللہ <strong>(صلی اللہ علیہ وآلہ)</strong> نے فرمایا:<br />«اے علیؑ! بے شک اللہ آپ کی بنا پر اپنے فرشتوں پر فخر و مباہات کرتا ہے۔»`,
        reference: "بحار الأنوار، ج ۳۸، ص ۱۰۰، حدیث ۱۹",
        audio: "assets/audio/5th%20Allah%20Ali%20a%20s%20ki%20bina%20par%20farishton%20par-esv2-100p-bg-m-music-m.mp3"
      }
    ];

    const bookEl = document.getElementById('book');
    const flipLeaf = document.getElementById('flipLeaf');
    const flipFront = document.getElementById('flipFront');
    const flipBack = document.getElementById('flipBack');
    const arabicText = document.getElementById('arabicText');
    const translText = document.getElementById('translationText');
    const refText = document.getElementById('referenceText');
    const badge = document.getElementById('hadeesBadge');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const dotsWrap = document.getElementById('bookDots');

    const FLIP_DUR = 620;
    let current = 0;
    let animating = false;

    /* ── Audio pool: first track loads eagerly, rest load quietly after page ── */
    const pool = ahadees.map((h, i) => {
      const a = new Audio();
      a.preload = i === 0 ? 'auto' : 'none';
      a.src = h.audio;
      return a;
    });
    window.addEventListener('load', () => setTimeout(() => {
      pool.forEach((a, i) => { if (i !== 0) { a.preload = 'auto'; a.load(); } });
    }, 1500));

    const playBtn  = document.getElementById('audioPlayBtn');
    const progWrap = document.getElementById('audioProgressWrap');
    const progFill = document.getElementById('audioProgressFill');
    const timeEl   = document.getElementById('audioTime');
    let currentAudio = pool[0];

    function fmtTime(s) {
      s = Math.floor(s);
      return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    }

    pool.forEach(a => {
      a.addEventListener('timeupdate', () => {
        if (a !== currentAudio) return;
        progFill.style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + '%';
        timeEl.textContent = fmtTime(a.currentTime);
      });
      a.addEventListener('ended', () => {
        if (a !== currentAudio) return;
        playBtn.textContent = '▶';
        progFill.style.width = '0%';
        timeEl.textContent = '0:00';
      });
    });

    playBtn.addEventListener('click', () => {
      if (currentAudio.paused) {
        currentAudio.play();
        playBtn.textContent = '⏸';
      } else {
        currentAudio.pause();
        playBtn.textContent = '▶';
      }
    });

    progWrap.addEventListener('click', e => {
      if (!currentAudio.duration) return;
      const r = progWrap.getBoundingClientRect();
      currentAudio.currentTime = ((e.clientX - r.left) / r.width) * currentAudio.duration;
    });

    function switchAudio(idx) {
      currentAudio.pause();
      currentAudio = pool[idx];
      currentAudio.currentTime = 0;
      playBtn.textContent = '▶';
      progFill.style.width = '0%';
      timeEl.textContent = '0:00';
    }


    ahadees.forEach((_, i) => {
      const d = document.createElement('button');
      d.className = 'book-dot' + (i === 0 ? ' active' : '');
      d.setAttribute('aria-label', 'Hadees ' + (i + 1));
      d.addEventListener('click', () => { if (!animating && i !== current) flip(i, i > current ? 'next' : 'prev'); });
      dotsWrap.appendChild(d);
    });

    function renderPages(idx) {
      const h = ahadees[idx];
      arabicText.textContent = h.arabic;
      translText.innerHTML = h.translation;
      refText.textContent = h.reference;
      badge.textContent = idx + 1;
      document.getElementById('pageNumLeft').textContent = `${idx + 1} / ${ahadees.length}`;
      document.getElementById('pageNumRight').textContent = `${idx + 1} / ${ahadees.length}`;
      switchAudio(idx);
      prevBtn.disabled = idx === 0;
      nextBtn.disabled = idx === ahadees.length - 1;
      dotsWrap.querySelectorAll('.book-dot').forEach((d, i) => d.classList.toggle('active', i === idx));
    }

    function leftFaceHTML(idx) {
      const h = ahadees[idx];
      return `<div class="page-inner">
      <div class="book-logo">
        <img src="assets/images/logo.jpg" alt="TSR GEMS" />
        <span class="book-logo-name">TSR GEMS</span>
      </div>
      <div class="hadees-badge">${idx + 1}</div>
      <div class="arabic-intro">قَالَ رَسُوْلُ اللّٰهِ (ص):</div>
      <div class="arabic-wrap"><div class="arabic">${h.arabic}</div></div>
      <div class="page-foot" style="color:rgba(245,158,11,0.35);text-align:center;font-family:'Inter',sans-serif">${idx + 1} / ${ahadees.length}</div>
    </div>`;
    }

    function rightFaceHTML(idx) {
      const h = ahadees[idx];
      return `<div class="page-inner">
      <div class="page-tag">✦ ترجمہ</div>
      <div class="translation-wrap"><p class="translation">${h.translation}</p></div>
      <div class="page-divider"></div>
      <div class="reference">${h.reference}</div>
      <div class="page-foot" style="color:rgba(120,70,20,0.35);text-align:center;font-family:'Inter',sans-serif">${idx + 1} / ${ahadees.length}</div>
    </div>`;
    }

    function flip(targetIdx, dir) {
      if (animating) return;
      animating = true;
      currentAudio.pause();
      playBtn.textContent = '▶';

      const isNext = dir === 'next';
      const h = ahadees[targetIdx];

      if (isNext) {
        translText.innerHTML = h.translation;
        refText.textContent = h.reference;
        document.getElementById('pageNumRight').textContent = `${targetIdx + 1} / ${ahadees.length}`;

        flipFront.className = 'flip-face flip-front right-face';
        flipFront.innerHTML = rightFaceHTML(current);
        flipBack.className = 'flip-face flip-back left-face';
        flipBack.innerHTML = leftFaceHTML(targetIdx);
        flipLeaf.style.left = 'calc(50% + 2.5px)';
        flipLeaf.style.transformOrigin = '-2.5px center';
      } else {
        arabicText.textContent = h.arabic;
        badge.textContent = targetIdx + 1;
        document.getElementById('pageNumLeft').textContent = `${targetIdx + 1} / ${ahadees.length}`;

        flipFront.className = 'flip-face flip-front left-face';
        flipFront.innerHTML = leftFaceHTML(current);
        flipBack.className = 'flip-face flip-back right-face';
        flipBack.innerHTML = rightFaceHTML(targetIdx);
        flipLeaf.style.left = '0';
        flipLeaf.style.transformOrigin = 'calc(100% + 2.5px) center';
      }

      bookEl.style.perspective = (bookEl.offsetWidth * 3.2) + 'px';
      flipLeaf.style.display = 'block';
      flipLeaf.style.transition = 'none';
      flipLeaf.style.transform = 'rotateY(0deg)';
      void flipLeaf.offsetWidth;

      flipLeaf.style.transition = `transform ${FLIP_DUR}ms cubic-bezier(0.645, 0.045, 0.355, 1.000)`;
      flipLeaf.style.transform = isNext ? 'rotateY(-180deg)' : 'rotateY(180deg)';

      function onEnd(e) {
        if (e.propertyName !== 'transform') return;
        flipLeaf.removeEventListener('transitionend', onEnd);
        current = targetIdx;

        if (isNext) {
          arabicText.textContent = h.arabic;
          badge.textContent = targetIdx + 1;
          document.getElementById('pageNumLeft').textContent = `${targetIdx + 1} / ${ahadees.length}`;
        } else {
          translText.innerHTML = h.translation;
          refText.textContent = h.reference;
          document.getElementById('pageNumRight').textContent = `${targetIdx + 1} / ${ahadees.length}`;
        }

        switchAudio(targetIdx);
        prevBtn.disabled = targetIdx === 0;
        nextBtn.disabled = targetIdx === ahadees.length - 1;
        dotsWrap.querySelectorAll('.book-dot').forEach((d, i) => d.classList.toggle('active', i === targetIdx));
        flipLeaf.style.transition = 'none';
        flipLeaf.style.display = 'none';
        animating = false;
      }
      flipLeaf.addEventListener('transitionend', onEnd);
    }

    function goNext() { if (current < ahadees.length - 1) flip(current + 1, 'next'); }
    function goPrev() { if (current > 0) flip(current - 1, 'prev'); }

    prevBtn.addEventListener('click', goPrev);
    nextBtn.addEventListener('click', goNext);
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') goNext();
      if (e.key === 'ArrowLeft') goPrev();
    });

    let tx0 = 0, ty0 = 0;
    bookEl.addEventListener('touchstart', e => {
      tx0 = e.changedTouches[0].clientX;
      ty0 = e.changedTouches[0].clientY;
    }, { passive: true });
    bookEl.addEventListener('touchend', e => {
      const dx = tx0 - e.changedTouches[0].clientX;
      const dy = Math.abs(ty0 - e.changedTouches[0].clientY);
      if (Math.abs(dx) > 40 && dy < 80) dx > 0 ? goNext() : goPrev();
    }, { passive: true });

    function setPerspective() {
      bookEl.style.perspective = (bookEl.offsetWidth * 3.2) + 'px';
    }
    window.addEventListener('resize', setPerspective);

    renderPages(0);
    if (document.fonts) document.fonts.ready.then(setPerspective);
    else window.addEventListener('load', setPerspective);
    setPerspective();

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>

</body>

</html>
